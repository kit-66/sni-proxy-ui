worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# ---------- STREAM: маршрутизация 443 по SNI ----------
stream {
    # Маппинг SNI -> бэкенд.
    map $ssl_preread_server_name $backend_by_sni {
        # Маскировочный домен для Reality (клиентский SNI)
        www.microsoft.com          reality_passthrough;

        # Домены с обычной TLS-терминацией (будут обрабатываться в http-блоке)
        site.example.com           tls_terminate;

        # Всё остальное — в Reality (чтобы не палить фингерпринт)
        default                    reality_passthrough;
    }

    upstream reality_passthrough {
        # Ссылка по имени сервиса: 3xui_app — это контейнер 3X-UI в сети proxy-net
        server 3xui_app:443;
    }

    upstream tls_terminate {
        # Внутренний listener для терминированных доменов
        server 127.0.0.1:8443;
    }

    server {
        listen 443;
        proxy_pass $backend_by_sni;

        # Критически важно: позволяет читать SNI до расшифровки
        ssl_preread on;

        proxy_connect_timeout 5s;
        proxy_timeout 300s;
    }
}

# ---------- HTTP: ACME + TLS-терминация + SNI-UI ----------
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    # Отдача http-01 челленджа для acme.sh
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Сюда автоматически добавляются server-блоки для терминированных доменов
    # через sni-ui.py (генерирует /etc/nginx/conf.d/*.conf)
    include /etc/nginx/conf.d/*.conf;

    # Служебный listener для терминированного TLS (принимает трафик от stream->tls_terminate)
    server {
        listen 127.0.0.1:8443 ssl default_server;
        server_name _;

        # Заглушка: нужна только чтобы nginx стартовал, если ещё нет реальных сертификатов
        ssl_certificate     /etc/nginx/certs/default/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/default/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            root /var/www/site;
        }
    }

    # SNI-UI (Flask) — отдельный порт, не связан с SNI-маршрутизацией
    server {
        listen 8085;

        location / {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
